# The permission is derived from the file name: mcdashboard.dashboard.server (op by default).
# Grant it with your permissions plugin, e.g. /lp group staff permission set mcdashboard.dashboard.server true
name: { en: Server, nl: Server, fr: Serveur, de: Server, es: Servidor }
description: { en: Performance and players, nl: Prestaties en spelers, fr: Performances et joueurs, de: Leistung und Spieler, es: Rendimiento y jugadores }
order: 20
# Optional subtle pattern behind the dashboard: grid, dirt, stone, planks, checker, cobble or creeper.
# Players can override it in the app.
background: stone
items:
  # widget: gauge is the half circle; the maximum comes from the max-players placeholder (max-from).
  - { placeholder: online, widget: gauge, title: { en: Players, nl: Spelers, fr: Joueurs, de: Spieler, es: Jugadores }, column: 0, row: 0, width: 2, height: 2 }
  - { placeholder: tps, widget: gauge, title: TPS, column: 2, row: 0, width: 2, height: 2 }
  - { placeholder: tps, widget: area, title: { en: TPS history, nl: TPS-historiek, fr: Historique TPS, de: TPS-Verlauf, es: Historial de TPS }, column: 0, row: 2, width: 4, height: 3, average: true }
  - { placeholder: online, widget: line, title: { en: Players over time, nl: Spelers door de tijd, fr: Joueurs au fil du temps, de: Spieler im Zeitverlauf, es: Jugadores a lo largo del tiempo }, column: 0, row: 5, width: 4, height: 3 }
  - { placeholders: [online, max-players], widget: list, title: { en: Capacity, nl: Capaciteit, fr: Capacité, de: Kapazität, es: Capacidad }, column: 0, row: 8, width: 2, height: 2 }
