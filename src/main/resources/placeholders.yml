# Expansion catalog: expose every placeholder an installed PlaceholderAPI expansion declares as an AUTO placeholder
# with the id <expansion>_<name> (explicit entries above win). Placeholders with parameters (<, { or [) are skipped and
# names containing ip, password, token, secret or address are always left out; deny adds more globs, max caps the amount
# (default 2000). Uncomment and restart.
# params: [a, b] lists names explicitly (each becomes %<expansion>_<a>%) and is combined with discovery. Discovery asks the
# expansion for its list and, when it declares none (many do not), PlaceholderAPI's cloud data; if both are empty the plugin
# logs a warning after a few retries and you should list the names with params.
# catalog:
#  - expansion: server
#    group: Server
#    access: PUBLIC
#    params: [online, max_players, tps]
#  - expansion: player
#    group: Player
#    access: PLAYER
#    permission: mcdashboard.catalog.player   # optional
#    deny: ['*displayname*']
#    max: 500
