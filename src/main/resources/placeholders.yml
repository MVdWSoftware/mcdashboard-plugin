# Only placeholders listed here can ever be read by the app.
# permission: optional Bukkit permission the paired player must hold to read it (a way to keep server internals for staff).
# access: PUBLIC (anyone who can reach the server) or PLAYER (needs a paired device; resolved for that player).
# type: STRING, INTEGER, DECIMAL, BOOLEAN, PERCENTAGE, AUTO (number, true/false or text, decided per value) or IMAGE.
# group / description: optional, shown by the app when browsing the catalog (group defaults to General).
placeholders:
  - id: online
    name: Players online
    group: Server
    description: Players currently connected
    value: '%server_online%'
    type: INTEGER
    access: PUBLIC
    max-from: max-players    # gauges use the value of this placeholder as their maximum
    min-interval: 5
    history: 120      # keep 2 hours of samples for charts (PUBLIC placeholders only)
  - id: tps
    name: Ticks per second
    group: Server
    description: Server performance, 20 is perfect
    value: '%server_tps_1%'
    type: DECIMAL
    access: PUBLIC
    min-interval: 5
    min-value: 0
    max-value: 20
    history: 120
  - id: max-players
    name: Max players
    group: Server
    value: '%server_max_players%'
    type: INTEGER
    access: PUBLIC
  - id: player-name
    name: Player
    group: Player
    value: '%player_name%'
    type: STRING
    access: PLAYER
  - id: player-health
    name: Health
    group: Player
    description: Hearts, 20 is full health
    value: '%player_health%'
    type: DECIMAL
    access: PLAYER
    min-interval: 2
    min-value: 0
    max-value: 20

# IMAGE placeholders (PNG, JPEG, GIF or WebP, max 256 KB, recognised by content, not by extension). Uncomment to use.
# source: file:<path> reads plugins/MCDashboard/images/<path> and reloads it when the file changes.
# source: url:<template> downloads (http/https, cached at least 5 minutes) and expands %placeholders% for the paired player.
