#
# Only placeholders listed here can ever be read by the app. Every key is explained in docs/placeholders.md.
# access: PUBLIC (anyone who can reach the server) or PLAYER (a paired device, resolved for that player).
# type: STRING, INTEGER, DECIMAL, BOOLEAN, PERCENTAGE, AUTO (decided per value) or IMAGE.
# permission: optional node the paired player must hold. history: minutes kept for charts (PUBLIC only).
# min-interval-permissions: optional map of permission node -> seconds for a faster interval, e.g. {mcdashboard.admin: 2}.
# PowerNukkitX: placeholders come from the PlaceholderAPI plugin for PowerNukkitX. Names are %name%; parameters follow a
# semicolon (%player_pos;x%). It cannot list what it has, so the catalog: section is not supported here.

placeholders:
  - id: online
    name: Players online
    group: Server
    description: Players currently connected
    value: '%server_online%'
    type: INTEGER
    access: PUBLIC
    max-from: max-players
    min-interval: 5
    history: 120
    history-interval: 15
  - id: tps
    name: Ticks per second
    group: Server
    description: Server performance, 20 is perfect
    value: '%server_tps%'
    type: DECIMAL
    access: PUBLIC
    min-interval: 5
    min-value: 0
    max-value: 20
    history: 120
  - id: max-players
    name: Max players
    group: Server
    value: '%server_max_players%'
    type: INTEGER
    access: PUBLIC
  - id: player-name
    name: Player
    group: Player
    value: '%player%'
    type: STRING
    access: PLAYER
  - id: player-health
    name: Health
    group: Player
    description: Hearts, 20 is full health
    value: '%player_health%'
    type: DECIMAL
    access: PLAYER
    min-interval: 2
    min-value: 0
    max-value: 20

  # The MCDashboard group: the plugin's own counters (docs/placeholders-api.md). Only offered to the app with
  # stats.offer-to-app: true in config.yml, because PUBLIC means any client can read these counts.
  - id: mcdashboard-devices
    name: Paired devices
    group: MCDashboard
    description: Devices paired with this server
    value: '%mcdashboard_devices%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
  - id: mcdashboard-devices-online
    name: Devices online
    group: MCDashboard
    description: Devices seen in the last 5 minutes
    value: '%mcdashboard_devices_online%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
    history: 120
  - id: mcdashboard-devices-server
    name: Devices on your licence
    group: MCDashboard
    description: Devices that say they use this server's licence (self-reported)
    value: '%mcdashboard_devices_server%'
    type: INTEGER
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-devices-app
    name: Devices on app unlock
    group: MCDashboard
    description: Devices that say they use the App unlock (self-reported)
    value: '%mcdashboard_devices_app%'
    type: INTEGER
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-devices-free
    name: Free devices
    group: MCDashboard
    description: Devices that say they use the free app (self-reported)
    value: '%mcdashboard_devices_free%'
    type: INTEGER
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-licensed
    name: Licensed
    group: MCDashboard
    description: Whether a licence id is configured
    value: '%mcdashboard_licensed%'
    type: BOOLEAN
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-license-state
    name: Licence state
    group: MCDashboard
    description: licensed (licence id configured) or free
    value: '%mcdashboard_license_state%'
    type: STRING
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-api-requests
    name: API requests
    group: MCDashboard
    description: Requests served since the plugin started
    value: '%mcdashboard_api_requests%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
  - id: mcdashboard-api-requests-per-minute
    name: API requests per minute
    group: MCDashboard
    description: Requests in the last minute
    value: '%mcdashboard_api_requests_per_minute%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
    unit: /min
    history: 120
  - id: mcdashboard-rate-limited
    name: Rate limited
    group: MCDashboard
    description: Requests refused by a rate limit since start
    value: '%mcdashboard_rate_limited%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
  - id: mcdashboard-live-clients
    name: Live clients
    group: MCDashboard
    description: Open live feed connections
    value: '%mcdashboard_live_clients%'
    type: INTEGER
    access: PUBLIC
    min-interval: 15
  - id: mcdashboard-history-samples
    name: History samples
    group: MCDashboard
    description: Samples written to the history database since start
    value: '%mcdashboard_history_samples%'
    type: INTEGER
    access: PUBLIC
    min-interval: 30
  - id: mcdashboard-history-storage
    name: History storage
    group: MCDashboard
    description: sqlite, mysql, mariadb, postgresql or off
    value: '%mcdashboard_history_storage%'
    type: STRING
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-placeholders
    name: Placeholders offered
    group: MCDashboard
    description: Placeholders this server offers
    value: '%mcdashboard_placeholders%'
    type: INTEGER
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-dashboards
    name: Dashboards
    group: MCDashboard
    description: Dashboards defined on this server
    value: '%mcdashboard_dashboards%'
    type: INTEGER
    access: PUBLIC
    min-interval: 60
  - id: mcdashboard-uptime
    name: Plugin uptime
    group: MCDashboard
    description: Seconds since the plugin started
    value: '%mcdashboard_uptime%'
    type: INTEGER
    access: PUBLIC
    min-interval: 30
    unit: s
  - id: mcdashboard-uptime-formatted
    name: Plugin uptime (text)
    group: MCDashboard
    description: Time since the plugin started
    value: '%mcdashboard_uptime_formatted%'
    type: STRING
    access: PUBLIC
    min-interval: 30
  - id: mcdashboard-version
    name: Plugin version
    group: MCDashboard
    description: MCDashboard version
    value: '%mcdashboard_version%'
    type: STRING
    access: PUBLIC
    min-interval: 300

