name: Bug report (plugin)
description: Something in the MCDashboard plugin (the Minecraft server plugin) does not work as documented
labels: [bug, plugin]
body:
  - type: markdown
    attributes:
      value: |
        ## Scope: MCDashboard plugin (the Minecraft server plugin)
        This tracker is **only** for the MCDashboard plugin (the Minecraft server plugin).
        For the MCDashboard app, the portal (accounts, licences, billing), the website, the WordPress plugin or the proxy, use https://mcdashboard.org/en/support/ or write to
        support+mcdashboard@mvdw-software.com. Such issues are closed here without a reply.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about the MCDashboard plugin (the Minecraft server plugin), not the app, the portal or another connected service.
          required: true
        - label: I searched the existing issues and the docs.
          required: true
  - type: markdown
    attributes:
      value: |
        **Do not post secrets**: remove the tunnel key, events token, database password and device tokens from logs and config.
        Security problems go to security@mvdw-software.com, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "e.g. 0.9.0 (/version MCDashboard)"
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Spigot / Paper, PowerNukkitX, Velocity, BungeeCord]
    validations: { required: true }
  - type: input
    id: server
    attributes:
      label: Server and Java version
      placeholder: "e.g. Paper 1.21.4, Java 21"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs and relevant config
      description: Secrets removed, please.
      render: text
