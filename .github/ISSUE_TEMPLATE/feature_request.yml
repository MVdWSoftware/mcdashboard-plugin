name: Feature request (plugin)
description: Suggest an improvement to the MCDashboard plugin (the Minecraft server plugin)
labels: [enhancement, plugin]
body:
  - type: markdown
    attributes:
      value: |
        ## Scope: MCDashboard plugin (the Minecraft server plugin)
        This tracker is **only** for the MCDashboard plugin (the Minecraft server plugin).
        For the MCDashboard app, the portal (accounts, licences, billing), the website, the WordPress plugin or the proxy, use https://mcdashboard.org/en/support/ or write to
        support@mcdashboard.org. Such issues may be closed without a reply.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about the MCDashboard plugin (the Minecraft server plugin), not the app, the portal or another connected service.
          required: true
        - label: I searched the existing issues and the docs.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
