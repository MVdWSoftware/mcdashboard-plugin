name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B verify
      - name: Nothing but the plugin's own classes may be in the jar
        run: |
          jar tf target/MCDashboard.jar | grep -vE '^(org/mcdashboard/|META-INF/|dashboards/|lang/|[a-z]+\.yml|org/$|dashboards/$|lang/$)' && exit 1 || true
      - uses: actions/upload-artifact@v4
        with: { name: MCDashboard, path: target/MCDashboard.jar }
