name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B verify
      - name: Nothing but the plugin's own classes may be in the jars
        run: |
          for jar in spigot/target/MCDashboard.jar nukkit/target/MCDashboard-Nukkit.jar; do
            jar tf "$jar" | grep -vE '^(org/mcdashboard/|META-INF/|dashboards/|lang/|nukkit/|[a-z]+\.yml|org/$|dashboards/$|lang/$|nukkit/$)' && exit 1 || true
          done
      - uses: actions/upload-artifact@v4
        with: { name: MCDashboard, path: "spigot/target/MCDashboard.jar\nnukkit/target/MCDashboard-Nukkit.jar" }
