name: E2E smoke tests
# The jars under test on real servers in Docker: Paper + Velocity + BungeeCord federating (scripts/proxy-smoke-test.sh),
# and PowerNukkitX (scripts/nukkit-smoke-test.sh). Runs on changes to the smoke tests themselves and nightly, so a
# drift in an upstream image or download URL is caught; also manual via Run workflow.
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/e2e.yml']
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/e2e.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paper-proxy:
    name: Paper, Velocity and BungeeCord
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build the jars
        run: mvn -B -ntp package -DskipTests
      - name: Smoke test on Paper, Velocity and BungeeCord
        run: scripts/proxy-smoke-test.sh "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proxy-smoke-logs
          path: ${{ runner.temp }}/smoke/logs-*.txt
          retention-days: 7
  powernukkitx:
    name: PowerNukkitX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build the jars
        run: mvn -B -ntp package -DskipTests
      - name: Smoke test on PowerNukkitX
        run: scripts/nukkit-smoke-test.sh "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nukkit-smoke-logs
          path: ${{ runner.temp }}/smoke/logs-*.txt
          retention-days: 7
