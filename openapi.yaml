openapi: 3.1.0
info:
  title: MCDashboard API
  version: 1.0.0
  description: |
    REST API exposed by the MCDashboard plugin (Spigot, Nukkit, Velocity, BungeeCord). Sensor data is encoded as SenML
    (RFC 8428, `application/senml+json`), authentication uses JWT bearer tokens (RFC 7519/6750).
    Value responses carry `ETag` and `Cache-Control: max-age=<min-interval>`, and anonymous
    responses are `public`, so a reverse proxy or CDN may cache them. Per-player responses are
    `private` and `Vary: Authorization`.
    A request with an invalid, expired or revoked bearer token gets `401` with
    `WWW-Authenticate: Bearer error="invalid_token"`, never the anonymous answer: refresh, or pair again.

    When the owner enables `security.allow-player-names`, an unpaired request may name the player with the
    `X-MCDashboard-Player` header (see the `PlayerName` parameter). The server resolves the name; a valid bearer token always
    wins. This is explicitly **not authentication**: anyone who can reach the API can type any player's name and read that
    player's PLAYER placeholders and permission-gated dashboards. Per-player answers stay `private`.

    Every route except `GET /info` requires the official app's `User-Agent`, `MCDashboard/<x.y.z> (<android|ios|dev>)`.
    Others get `403`; a version below the server's `minClientVersion` gets `426`. A server owner can allow more clients.
    The User-Agent identifies the client and its version; it is not a credential. Responses do not vary by it.

    Any authenticated request may carry `X-MCDashboard-Entitlement: server | app | free` (see the `Entitlement` header
    parameter): what the app says it runs under. It is self-reported and informational; the plugin stores the last valid value
    on the device, shows it to the owner and never uses it to allow, refuse or limit anything.
servers:
  - url: https://{host}/v1
    variables: { host: { default: mc.example.com } }
security:
  - {}
  - bearer: []
paths:
  /info:
    get:
      summary: Server information and capabilities
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Info' } } } }
  /auth:
    post:
      summary: Pair a device with the one-time code from /mcdashboard link
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthRequest' } } }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { description: Invalid or expired code }
        '403': { description: Device limit reached }
        '429': { description: Too many attempts }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and get a new access token
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { description: Invalid, revoked or already used refresh token }
  /placeholders:
    get:
      summary: Placeholders the caller may read (metadata only), searchable and paged, sorted by group then name
      parameters:
        - { $ref: '#/components/parameters/Entitlement' }
        - { name: q, in: query, required: false, schema: { type: string }, description: Case-insensitive substring of id, name, description or group }
        - { name: group, in: query, required: false, schema: { type: string }, description: Exact group name }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: ids, in: query, required: false, schema: { type: string }, description: 'Comma separated ids (max 100). Returns exactly the readable ones and ignores q, group, limit and offset; groups is empty' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { description: 'OK. Cacheable: public when anonymous, private when authenticated', content: { application/json: { schema: { $ref: '#/components/schemas/PlaceholdersPage' } } } }
        '400': { description: Invalid limit, offset or ids }
  /placeholders/{id}:
    get:
      summary: Current value as a one-record SenML pack
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { $ref: '#/components/responses/Values' }
        '304': { description: Not modified }
        '401': { description: Authentication required }
        '404': { description: Unknown placeholder }
  /values:
    get:
      summary: Current values of up to 100 placeholders as one SenML pack
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: Comma separated ids }
        - { $ref: '#/components/parameters/Entitlement' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { $ref: '#/components/responses/Values' }
        '304': { description: Not modified }
  /history/{id}:
    get:
      summary: Recorded samples of a PUBLIC placeholder with history enabled, as a SenML pack
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: integer }, description: unix seconds }
        - { name: points, in: query, required: false, schema: { type: integer, minimum: 2, maximum: 2000, default: 2000 }, description: 'at most this many records; longer series are reduced by averaging numbers (text: the last value) per equal time bucket, each record keeps the time of the last sample in its bucket' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { $ref: '#/components/responses/Values' }
        '404': { description: No history for this placeholder }
  /dashboards:
    get:
      summary: The preset dashboards the caller may open (by permission), in order
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { description: 'OK. Names and descriptions are translated for Accept-Language; Vary: Authorization, Accept-Language', content: { application/json: { schema: { type: object, required: [dashboards, canUpload], properties: { dashboards: { type: array, items: { $ref: '#/components/schemas/DashboardSummary' } }, canUpload: { type: boolean, description: 'the paired player holds mcdashboard.developer and the owner enabled developer mode' } } } } } }
    post:
      summary: Upload or replace the caller's developer dashboard (saved as dev-<player>.yml)
      description: |
        Developer mode must be on (`developer.enabled` or `/mcdashboard developer on`) and the caller needs
        `mcdashboard.developer`. The server assigns the id, order, permission and owner; uploading again replaces the
        caller's one dashboard. The saved permission is `mcdashboard.dashboard.<id>`; only players with that permission
        (developers inherit it) can see the dashboard.
      security: [ { bearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/AcceptLanguage' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardUpload' }
      responses:
        '200': { description: 'Saved. Names and titles are translated for Accept-Language', content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '400': { description: Invalid dashboard (unknown placeholder or widget, no items, a value out of range, overlapping tiles or a tile past the fourth column) }
        '401': { description: Not paired }
        '403': { description: Developer mode is off, or the caller lacks mcdashboard.developer }
        '422':
          description: >-
            The dashboard is valid but above a cap the server owner set (`limits.max-tiles`: more tiles than allowed;
            `limits.max-dashboards`: a new dashboard would exceed the number of dashboards; replacing the caller's own is
            always allowed). Buying the app or a licence does not lift it.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [tiles-limit, dashboards-limit] }
  /dashboards/{id}:
    get:
      summary: One preset, filtered to the placeholders the caller may read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { description: 'OK. Names, descriptions and tile titles are translated for Accept-Language; Vary: Authorization, Accept-Language, X-MCDashboard-Player when player names are allowed', content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        '404': { description: Unknown, or not offered to this caller }
  /dashboard:
    get:
      summary: The first dashboard the caller may open (kept for apps that predate presets)
      parameters:
        - { $ref: '#/components/parameters/AcceptLanguage' }
        - { $ref: '#/components/parameters/PlayerName' }
      responses:
        '200': { description: 'OK. Translated for Accept-Language', content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
  /devices/self:
    delete:
      summary: Unpair the calling device
      security: [ { bearer: [] } ]
      responses:
        '200': { description: Revoked }
  /events:
    get:
      summary: Stream of device events for a service such as MCDashboard-proxy (server-sent events)
      x-internal: true
      description: |
        Not for apps; a reverse proxy uses it to learn that a device was revoked (`/mcdashboard revoke` or
        `DELETE /v1/devices/self`) so it stops serving what it cached for that device. It does not exist unless
        `events.token` is set, and the token (not a device token) is the credential. Keep it off the public side.

        `Content-Type: text/event-stream`. Each event has `id: <epoch>:<seq>`, `event: device.revoked` and the JSON
        `DeviceRevokedEvent` as data; `: ping` comments keep the connection alive. After a reconnect send the last id
        as `Last-Event-ID`: missed events are replayed (the last 256 are kept). When that is impossible (the plugin
        restarted, or the history moved on) the stream starts with `event: reset` and the consumer must assume it
        missed revocations (a cache should drop what it holds for devices).
      security: [ { eventsToken: [] } ]
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, example: 'a1b2c3d4:17' } }
      responses:
        '200': { description: The event stream, content: { text/event-stream: { schema: { type: string } } } }
        '401': { description: Missing or wrong events token }
        '404': { description: Events are not enabled }
        '429': { description: Too many attempts }
        '503': { description: Too many open event streams }
webhooks:
  deviceRevoked:
    post:
      summary: A device was revoked (sent to every URL in `events.webhooks`)
      description: |
        Delivered once per event with retries (about 12 minutes), so a receiver must be idempotent and answer `2xx`.
        Headers: `X-MCDashboard-Event: device.revoked`, `X-MCDashboard-Delivery: <epoch>:<seq>`,
        `X-MCDashboard-Timestamp` (unix seconds) and `X-MCDashboard-Signature: sha256=<hex>`, the HMAC-SHA256 of
        `<timestamp>.<raw body>` keyed with the webhook's `secret`. Verify in constant time and reject timestamps
        more than a few minutes old.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRevokedEvent' } } }
      responses:
        '204': { description: Accepted }
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, example: 'nl-BE,nl;q=0.9,en;q=0.8' }
      description: |
        The app's UI language (one of en, nl, fr, de, es; regions are ignored). Dashboard names,
        descriptions and tile titles are resolved in this language, then in the server's
        `server.default-language`, then in any language the dashboard provides.
    PlayerName:
      name: X-MCDashboard-Player
      in: header
      required: false
      schema: { type: string, maxLength: 32, example: Steve }
      description: |
        The player whose PLAYER placeholders and permission-gated dashboards an unpaired caller wants, on a server with
        `security.allow-player-names: true`. The server resolves the name (online or known offline on that platform) and
        answers as that player. Ignored when the request carries a valid bearer token, and when the setting is off the
        header has no effect. **Not authentication:** there is no proof that the caller controls that player, so anyone could
        read that player's data by typing the name. Answers are always `private` and vary on this header.
    Entitlement:
      name: X-MCDashboard-Entitlement
      in: header
      required: false
      schema: { type: string, enum: [server, app, free] }
      description: |
        Which licence the calling device uses: `server` (the server's own licence, verified by the app), `app` (the App unlock)
        or `free`. Honoured on every authenticated route, not only where it is listed; ignored when the request is not
        authenticated, when the value is not one of the three (the previous value stays), and on the live feed. Self-reported by the
        app, informational only: the plugin never decides anything with it.
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    eventsToken: { type: http, scheme: bearer, description: The shared `events.token` from config.yml }
  responses:
    UnsupportedClient:
      description: 'Any route except GET /info: the User-Agent is missing or is not the official app (MCDashboard/x.y.z (android|ios|dev)) and is not allowed by the owner (security.allowed-clients)'
      content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string } } } } }
    ClientTooOld:
      description: 'Any route except GET /info: the app version is below security.min-client-version; update the app'
      content: { application/json: { schema: { type: object, required: [error, minVersion], properties: { error: { type: string }, minVersion: { type: string } } } } }
    TooManyRequests:
      description: 'The device (or, when not paired, the address) exceeded security.requests-per-minute'
      headers: { Retry-After: { schema: { type: integer }, description: seconds } }
      content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: string } } } } }
    Values:
      description: SenML pack (RFC 8428)
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string }, description: 'public|private, max-age=<seconds>' }
      content: { application/senml+json: { schema: { type: array, items: { $ref: '#/components/schemas/SenMLRecord' } } } }
  schemas:
    DeviceRevokedEvent:
      type: object
      required: [type, epoch, seq, time, deviceId, player]
      properties:
        type: { type: string, enum: [device.revoked] }
        epoch: { type: string, description: Identifies one run of the plugin; the sequence restarts with a new epoch }
        seq: { type: integer, description: Counts events within the epoch }
        time: { type: integer, description: unix seconds }
        deviceId: { type: string, description: The `sub` claim of the revoked device's tokens }
        player: { type: string, description: UUID of the player the device was paired to }
    Info:
      type: object
      required: [name, plugin, version, protocol, authRequired]
      properties:
        name: { type: string }
        plugin: { const: MCDashboard }
        version: { type: string }
        protocol: { type: integer, description: 'major API version; bumped only for a change that would break an older app, which then asks its player to update. Clients that do not know a higher value ask for an update; clients treat a missing value as 1' }
        features:
          x-known: [presets, history-points, upload, tls, background, client-verification, player-names]
          type: array
          items: { type: string }
          description: 'optional capabilities of this connection (for example presets, history-points, upload, tls). Additions never bump `protocol`. Through a proxy this is the intersection with what that proxy can carry, so an older proxy hides a feature instead of advertising a route, header or query parameter it would drop. Absent on older plugins. A client gates features that need the plugin on this list and works without them'
        authRequired: { type: boolean }
        allowPlayerNames:
          type: boolean
          description: >-
            `security.allow-player-names`: an unpaired client may pick a player with the `X-MCDashboard-Player` header.
            Not authentication; the app only offers the field when this is true (or `player-names` is in `features`).
            False through a proxy that cannot forward the player header, even when the owner enabled it.
        defaultLanguage: { type: string, enum: [en, nl, fr, de, es], description: 'language used when the app asks for one a dashboard does not provide' }
        languages: { type: array, items: { type: string, enum: [en, nl, fr, de, es] }, description: 'languages the server publishes dashboards in, sorted' }
        websocketPort: { type: integer }
        websocketTls: { type: boolean, description: 'the live feed on websocketPort is TLS (wss://host:port/v1/live); the plugin terminates TLS itself' }
        tlsFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the plugin''s own self-signed certificate; clients pin it (also carried as pin= in the pairing link). Absent with a CA-signed certificate' }
        polling: { type: boolean, description: 'false when values are only served over the live feed (GET /v1/values and /v1/placeholders/{id} answer 403); absent means polling works' }
        endpoints:
          type: array
          items: { type: string, format: uri }
          description: >-
            Where clients should connect (for example the MCDashboard-proxy), best first. The address a client was given is
            only used to read this list; clients use the first endpoint that answers /v1/info as an MCDashboard server.
        icon: { type: string, description: data URI }
        motd: { type: string, description: legacy section-sign colour codes }
        online: { type: integer }
        maxPlayers: { type: integer }
        gameVersion: { type: string }
        gamePort: { type: integer }
        licenseHash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 (hex) of the public id of the server''s premium subscription; the id itself is never published' }
        minClientVersion: { type: string, pattern: '^\d+\.\d+\.\d+$', description: 'oldest app version the server accepts; older apps get 426' }
        limits:
          type: object
          description: >-
            Caps the owner set (`limits.max-dashboards`, `limits.max-tiles`) to protect the server's performance. Absent, or a
            member absent or 0, means no cap. A cap applies whatever the app unlock or licence, so clients show at most
            min(their own limit, the cap) and must not offer a purchase to lift it. Absent on older plugins.
          properties:
            maxDashboards: { type: integer, minimum: 1, description: 'dashboards (presets) the app shows for this server' }
            maxTiles: { type: integer, minimum: 1, description: 'tiles the app shows on one dashboard' }
    AuthRequest:
      type: object
      required: [otp]
      properties: { otp: { type: string }, deviceLabel: { type: string, maxLength: 40 } }
    Tokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, player]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer }
        player: { type: object, properties: { uuid: { type: string }, name: { type: string } } }
    PlaceholdersPage:
      type: object
      required: [placeholders, total, groups]
      properties:
        placeholders: { type: array, items: { $ref: '#/components/schemas/Placeholder' } }
        total: { type: integer, description: matches before paging }
        groups:
          type: array
          description: groups of the readable placeholders matching q (ignoring the group filter), sorted by name
          items: { type: object, required: [name, count], properties: { name: { type: string }, count: { type: integer } } }
    Placeholder:
      type: object
      required: [id, name, type, access, group, minInterval]
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string, description: 'catalog group, "General" by default' }
        description: { type: string }
        type: { enum: [STRING, INTEGER, DECIMAL, BOOLEAN, PERCENTAGE, AUTO, IMAGE, LIST], description: 'AUTO values are typed per value; IMAGE values arrive as vd (the picture), or as vs (an https URL the client loads itself) when the owner set encode: false; LIST values (a leaderboard, a player list) arrive as a JSON table in vs: {"columns":["name","value"],"rows":[["Steve",120],["Alex","10k"]]}. A cell is a number when the whole cell parses as one (colour codes and thousands separators ignored), else text with the legacy colour codes kept (at most 256 characters); trailing empty rows are dropped. LIST has no history' }
        access: { enum: [PUBLIC, PLAYER] }
        minInterval: { type: integer, description: 'seconds; the effective minimum refresh interval for this caller, including permission overrides' }
        min: { type: number }
        max: { type: number }
        unit: { type: string }
        maxFrom: { type: string, description: id of the placeholder whose value is this one's maximum }
        columns: { type: array, maxItems: 6, items: { type: string, pattern: '^[a-z][a-z0-9_]{0,23}$' }, description: 'LIST only: the column names in order' }
        rows: { type: integer, minimum: 1, maximum: 50, description: 'LIST only: the most rows a value can have' }
        historyMinutes: { type: integer, description: 'minutes of history kept (in memory, or in the database when the owner enabled persistent history); see /history/{id}' }
    SenMLRecord:
      type: object
      required: [n, t]
      properties:
        n: { type: string, description: placeholder id }
        t: { type: number, description: unix time in seconds }
        u: { type: string }
        v: { type: number }
        vb: { type: boolean }
        vs: { type: string, description: 'string value; for a LIST placeholder compact JSON {"columns":[...],"rows":[[...],...]}; for an IMAGE placeholder the server does not embed (encode: false) the https URL to load the picture from directly' }
        vd: { type: string, description: 'RFC 8428 data value: an IMAGE (PNG, JPEG, GIF or WebP, max 256 KB) as base64url without padding; sniff the type from the bytes' }
    DashboardSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, description: 'translated for Accept-Language' }
        description: { type: string, description: 'translated for Accept-Language' }
    Dashboard:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: 'translated for Accept-Language' }
        description: { type: string, description: 'translated for Accept-Language' }
        permission: { type: string, description: 'derived from the file name: mcdashboard.dashboard.<id>' }
        background:
          type: string
          enum: [grid, dirt, stone, planks, checker, cobble, creeper]
          description: subtle pattern behind the dashboard; the player can override it
        backgroundImage: { $ref: '#/components/schemas/BackgroundImage' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
    Icon:
      type: string
      maxLength: 64
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*:[a-z0-9]+(-[a-z0-9]+)*$'
      description: 'icon as pack:name with an Iconify prefix the app bundles (fa6-solid, fa6-regular, fa6-brands, game-icons, pixelarticons, ion, mdi), e.g. fa6-solid:memory; an unknown icon is not drawn'
    TileColor:
      type: string
      enum: [accent, green, yellow, orange, red, purple, cyan, muted]
      description: named colour; the app maps it to a theme token
    Threshold:
      type: object
      required: [when, value, color]
      properties:
        when: { type: string, enum: [above, below] }
        value: { type: number }
        color: { $ref: '#/components/schemas/TileColor' }
    TileOptions:
      type: object
      description: how a tile looks; every field is optional, widgets ignore what does not apply, the server drops unknown keys
      properties:
        style: { type: string, pattern: '^[a-z0-9-]{1,24}$', description: 'widget variant, e.g. progress: bar, segments, battery, bullet, hearts, hunger, armor, xp' }
        color: { $ref: '#/components/schemas/TileColor' }
        thresholds: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Threshold' }, description: checked in order, the first match colours the value }
        decimals: { type: integer, minimum: 0, maximum: 4 }
        compact: { type: boolean, description: '1.2k instead of 1,234 (default true)' }
        unit: { type: string, maxLength: 16, description: replaces the placeholder unit; empty hides it }
        unitSize: { type: string, enum: [s, m, l], description: 'size of the unit next to the value, relative to the value; default s (small)' }
        unitColor: { $ref: '#/components/schemas/TileColor' }
        prefix: { type: string, maxLength: 8 }
        hideTitle: { type: boolean }
        align: { type: string, enum: [start, center, end] }
        size: { type: string, enum: [s, m, l] }
        card: { type: string, enum: [default, accent, plain] }
        target: { type: number, description: marker of the bullet style }
        invertTrend: { type: boolean, description: 'stat: a falling value is good' }
        count: { type: integer, minimum: 1, maximum: 20, description: icons or segments of the icon and segment styles }
        fit: { type: string, enum: [contain, cover, fill, none], description: 'image widget: contain (default), cover (edge to edge, cropped), fill (stretched) or none (natural size)' }
        position: { type: string, enum: [center, top, bottom], description: 'image widget: which part stays visible when cover crops; default center' }
        padding: { type: string, enum: [none, s, m], description: space between the card edge and the content; the widget default when absent }
        smoothing: { type: string, enum: [auto, pixelated, smooth], description: 'image scaling; auto (default) is pixelated when scaled up and smooth when scaled down' }
        markerIcon: { $ref: '#/components/schemas/Icon', description: 'gauge, ring and progress bar: icon drawn at the value position, e.g. a sun on the arc' }
        hideValue: { type: boolean, description: 'progress: hides the value, so hearts show the health without the number' }
        biome: { type: string, maxLength: 64, description: 'sky widget: a fixed biome (snowy_plains, desert, ...) deciding what falls in a storm: rain, snow or nothing' }
        speed: { type: string, enum: [slow, normal, fast], description: 'ticker widget: scroll speed; default normal' }
        background: { $ref: '#/components/schemas/TileBackground' }
    TileBackground:
      type: object
      description: 'a background behind one tile, under its content; dropped when nothing valid is left; only https URLs are accepted from the server'
      properties:
        color: { $ref: '#/components/schemas/TileColor' }
        gradient: { allOf: [{ $ref: '#/components/schemas/TileColor' }], description: 'second colour: a diagonal gradient from color (default accent) to this one' }
        url: { type: string, maxLength: 2048, pattern: '^https://', description: an https URL the app loads directly }
        dim: { type: number, minimum: 0, maximum: 0.9, default: 0.4, description: 'with url: how much the tile colour covers the picture' }
        blur: { type: number, minimum: 0, maximum: 20, default: 0, description: 'with url: pixels' }
        fit: { type: string, enum: [cover, contain, tile], default: cover, description: with url }
    BackgroundImage:
      type: object
      required: [url]
      description: 'picture behind the dashboard (dashboards/*.yml: background-image); wins over background; the player can override it'
      properties:
        url: { type: string, maxLength: 2048, pattern: '^https://', description: an https URL the app loads directly }
        dim: { type: number, minimum: 0, maximum: 0.9, default: 0.4, description: how much the dashboard colour covers the picture }
        blur: { type: number, minimum: 0, maximum: 20, default: 0, description: pixels }
        fit: { type: string, enum: [cover, contain, tile], default: cover }
    DashboardItem:
      type: object
      required: [placeholder, widget]
      properties:
        placeholder: { type: string, description: the first placeholder; older apps only read this one }
        placeholders: { type: array, items: { type: string }, description: all placeholders of a combined tile (list, line, bar, pie), the first included; only those the caller may read; absent for a single one }
        widget: { type: string, description: widget id of the app }
        title: { type: string, description: 'translated for Accept-Language' }
        icon: { $ref: '#/components/schemas/Icon' }
        options: { $ref: '#/components/schemas/TileOptions' }
        column: { type: integer }
        row: { type: integer }
        width: { type: integer }
        height: { type: integer }
    DashboardItemUpload:
      type: object
      required: [widget]
      anyOf:
        - { required: [placeholder] }
        - { required: [placeholders] }
      properties:
        placeholder: { type: string, description: the first placeholder; required unless placeholders is given }
        placeholders: { type: array, items: { type: string }, minItems: 1, maxItems: 12 }
        widget: { type: string, enum: [text, ticker, image, number, countdown, progress, list, heads, leaderboard, status, gauge, ring, line, area, bar, pie, stat, stacked, heatmap, sky] }
        title: { type: string, maxLength: 80 }
        icon: { $ref: '#/components/schemas/Icon' }
        options: { $ref: '#/components/schemas/TileOptions' }
        column: { type: integer, minimum: 0, maximum: 3 }
        row: { type: integer, minimum: 0, maximum: 999 }
        width: { type: integer, minimum: 1, maximum: 4 }
        height: { type: integer, minimum: 1, maximum: 64 }
    DashboardUpload:
      type: object
      required: [name, items]
      properties:
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 240 }
        background:
          type: string
          enum: [grid, dirt, stone, planks, checker, cobble, creeper]
        backgroundImage: { $ref: '#/components/schemas/BackgroundImage' }
        items:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/DashboardItemUpload' }
