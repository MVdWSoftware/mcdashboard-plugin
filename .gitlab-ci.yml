stages: [test]

build:
  stage: test
  image: maven:3-eclipse-temurin-21
  script:
    - mvn -B verify
    - for jar in spigot/target/MCDashboard.jar nukkit/target/MCDashboard-Nukkit.jar; do jar tf "$jar" | grep -vE '^(org/mcdashboard/|META-INF/|dashboards/|lang/|nukkit/|[a-z]+\.yml|org/$|dashboards/$|lang/$|nukkit/$)' && exit 1 || true; done  # nothing shaded
  artifacts:
    paths: [spigot/target/MCDashboard.jar, nukkit/target/MCDashboard-Nukkit.jar]
