stages: [test]

build:
  stage: test
  image: maven:3-eclipse-temurin-21
  script:
    - mvn -B verify  # JaCoCo report + coverage check per module (limits in each pom)
    - 'awk -F, ''NR>1 {m+=$8; c+=$9} END {printf "Total coverage: %.1f %%\n", 100*c/(m+c)}'' core/target/site/jacoco/jacoco.csv'
    - for jar in spigot/target/MCDashboard.jar nukkit/target/MCDashboard-Nukkit.jar velocity/target/MCDashboard-Velocity.jar bungee/target/MCDashboard-Bungee.jar; do jar tf "$jar" | grep -vE '^(org/mcdashboard/|META-INF/|dashboards/|lang/|nukkit/|proxy/|skills/|[a-z-]+\.(yml|json)|org/$|dashboards/$|lang/$|nukkit/$|proxy/$)' && exit 1 || true; done  # nothing shaded (Velocity's SnakeYAML is relocated under org/mcdashboard/libs/)
  coverage: '/Total coverage: (\d+\.\d+) %/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: jacoco
        path: '*/target/site/jacoco/jacoco.xml'
    paths: ['*/target/site/jacoco/', spigot/target/MCDashboard.jar, nukkit/target/MCDashboard-Nukkit.jar, velocity/target/MCDashboard-Velocity.jar, bungee/target/MCDashboard-Bungee.jar]
